<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Cancer Detection</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page">
    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <div class="brand">
                <!-- Medical / DNA Icon -->
                <div class="logo">
                    🧬
                </div>
                <div class="brand-text">
                    <h1>Skin Cancer Detection</h1>
                    <div class="status">
                        <span class="status-dot"></span>
                        Online
                    </div>
                </div>
            </div>
            <!-- RESET BUTTON -->
            <button
                class="reset-btn"
                id="resetBtn"
                title="Reset">
                ↻
            </button>
        </header>
        <!-- CHAT -->
        <main class="chat" id="chatBox">
            <div class="bot-row">
                <div class="bot-icon">
                    🤖
                </div>
                <div class="bot-bubble">
                    <div class="hello">
                        Hello!
                    </div>
                    <div class="main-text">
                        Send your skin image to get
                        an AI-based prediction.
                    </div>
                    <div class="notice">
                        Results are only for screening,
                        consult a doctor.
                    </div>
                </div>
            </div>
        </main>
        <!-- CAMERA -->
        <div
            class="camera-box"
            id="cameraBox">
            <video
                id="cameraPreview"
                autoplay
                playsinline>
            </video>
            <div class="camera-controls">
                <button id="captureBtn">
                    📸 Capture
                </button>
                <button id="closeCameraBtn">
                    ✕ Close
                </button>
            </div>
        </div>
        <!-- BOTTOM -->
        <footer class="bottom">
            <input
                type="file"
                id="fileInput"
                accept="image/*"
                hidden
            >
            <button
                class="bottom-btn upload"
                id="uploadBtn">
                Upload
            </button>
            <button
                class="bottom-btn live"
                id="liveBtn">
                Live
            </button>
            <button
                class="predict-btn"
                id="predictBtn">
                ➤
            </button>
        </footer>
    </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
